site_name: tapeout-ready
site_description: ASIC design interview prep — RTL, STA, CDC, resets, low power, and digital fundamentals.
site_url: https://rmchip.github.io/tapeout-ready/
repo_url: https://github.com/rmchip/tapeout-ready
repo_name: rmchip/tapeout-ready

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Track 1 — Combinational Logic:
      - Overview: 01-combinational-logic/README.md
      - 01 · Muxes & Adders: 01-combinational-logic/01-muxes-and-adders.md
  - Track 2 — Flip-Flops & Timing:
      - Overview: 02-flip-flops/README.md
      - 01 · Setup, Hold, Skew & Jitter: 02-flip-flops/01-setup-hold-skew-jitter.md
